name: Build and Release Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Set up Expo & EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android Preview APK (Local Build)
        run: |
          # We run the build locally to bypass EAS Cloud queue and subscription limits
          # It generates the APK inside the current directory
          eas build --platform android --profile preview --local --non-interactive --output=app-release.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## Automated Build Output
            
            This release contains the compiled Android `.apk` package generated automatically from commit `${{ github.sha }}`.
            
            ### Installation Instructions
            1. Download the `app-release.apk` file.
            2. Transfer the file to your Android device (or download it directly).
            3. Tap the file to install it (you may need to allow installs from unknown sources in settings).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
